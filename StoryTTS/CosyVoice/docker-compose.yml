services:
  gateway:
    build: .
    ports:
      - "8002:8002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      COSYVOICE_URL: http://host.docker.internal:50000
      COSYVOICE_SAMPLE_RATE: 24000
      VOICE_PROMPT: /app/voices/narrator.wav
      MAX_CONCURRENCY: 1
      TTS_API_KEY: ""
    volumes:
      - ./voices:/app/voices:ro
    restart: unless-stopped
